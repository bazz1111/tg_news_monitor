[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_news_monitor"
version = "0.1.0"
description = "24/7 automated TG-news monitoring and breaking-event alerting service with zero account ban risk."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.3.0",
    "loguru>=0.7.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:build_card is deprecated:DeprecationWarning",
    "ignore:FeishuCardBuilder.build_card is a legacy:DeprecationWarning",
]
markers = [
    "real_schedule: use real Asia/Shanghai alert-window classification",
]

# Minimal rule set so CI is not 700-finding noise. Do not expand without cleanup.
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []
