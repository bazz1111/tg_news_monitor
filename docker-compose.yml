services:
  tg_news_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_news_monitor
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 1g
    memswap_limit: 1g
    # Nested Docker custom bridge cannot reach t.me (TCP timeout);
    # host net shares host egress. No host ports published by this app.
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # Optional: copy topic_filters.yaml.example first; do not commit the live file.
      # - ./topic_filters.yaml:/app/topic_filters.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/tg_news.db
      - CONFIG_PATH=/app/config.yaml
      # - TOPIC_FILTERS_PATH=/app/topic_filters.yaml
