services:
  tg_news_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_news_monitor
    restart: unless-stopped
    # Nested Docker custom bridge cannot reach t.me (TCP timeout);
    # host net shares host egress. No host ports published by this app.
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/tg_news.db
